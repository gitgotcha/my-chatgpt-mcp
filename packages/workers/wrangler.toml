name = "reliable-drive-sync"
main = "src/index.ts"
compatibility_date = "2026-08-12"

[vars]
SYNC_WORKER_URL = "https://reliable-drive-sync.qiaobingyuan886.workers.dev/v1/sync"
QSTASH_FAILURE_CALLBACK_URL = "https://reliable-drive-sync.qiaobingyuan886.workers.dev/v1/qstash/failure"
QSTASH_URL = "https://qstash-us-east-1.upstash.io"
DRIVE_EVENTS_PARENT_ID = "1ZZRD4a1Z93NT1OGKbRkLPu13TsHbDsF8"
DRIVE_SNAPSHOTS_PARENT_ID = "1bAokejGSIdn2oLCWPjDgSb3xbiX0r999"
DRIVE_ARTIFACTS_PARENT_ID = ""

# D1 database id is non-secret. All credentials are supplied with Wrangler
# secrets and must never be committed.
[[d1_databases]]
binding = "DB"
database_name = "reliable-drive-sync"
database_id = "64e7d63f-9275-45d3-be73-9e8cd4908ccd"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "reliable-drive-sync-artifacts"

[triggers]
crons = ["*/5 * * * *", "0 * * * *", "0 */6 * * *"]
